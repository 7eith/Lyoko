---
- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: https://{{ jellyfin_domain }}.{{ lyoko_domain }}
        description: Films & séries
{% if jellyfin_api_key | default('') | length > 0 %}
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{ jellyfin_api_key }}"
          # Required since Jellyfin 12: v2 API (native endpoints + MediaBrowser token)
          version: 2
          enableBlocks: true
          enableNowPlaying: true
{% endif %}
    - Sonarr:
        icon: sonarr.png
        href: https://{{ sonarr_domain }}.{{ lyoko_domain }}
        description: Gestion des séries
{% if sonarr_api_key | default('') | length > 0 %}
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{ sonarr_api_key }}"
{% endif %}
    - Radarr:
        icon: radarr.png
        href: https://{{ radarr_domain }}.{{ lyoko_domain }}
        description: Gestion des films
{% if radarr_api_key | default('') | length > 0 %}
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{ radarr_api_key }}"
{% endif %}
    - Prowlarr:
        icon: prowlarr.png
        href: https://{{ prowlarr_domain }}.{{ lyoko_domain }}
        description: Gestion des indexers
{% if prowlarr_api_key | default('') | length > 0 %}
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{ prowlarr_api_key }}"
{% endif %}
    - Profilarr:
        icon: mdi-tune
        href: https://{{ profilarr_domain }}.{{ lyoko_domain }}
        description: Profils de qualité & custom formats
- Downloads:
    - qBittorrent:
        icon: qbittorrent.png
        href: https://{{ qbittorrent_domain }}.{{ lyoko_domain }}
        description: Client torrent (via VPN)
{% if qbittorrent_username | default('') | length > 0 %}
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          username: "{{ qbittorrent_username }}"
          password: "{{ qbittorrent_password }}"
{% endif %}
    - QUI:
        icon: mdi-view-dashboard-variant
        href: https://{{ qui_domain }}.{{ lyoko_domain }}
        description: Multi-instances & cross-seed
- Services:
    - Vaultwarden:
        icon: vaultwarden.png
        href: https://{{ vaultwarden_domain }}.{{ lyoko_domain }}
        description: Gestionnaire de mots de passe
    - Traefik:
        icon: traefik.png
        href: https://traefik.{{ lyoko_domain }}
        description: Dashboard reverse proxy & certificats
- Networking:
    - Router:
        icon: freebox-pop
        href: http://192.168.1.254/
        description: Freebox OS
