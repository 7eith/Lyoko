---
- logo:
    icon: /images/lyoko-banner.png
- search:
    provider: google
    focus: true
    target: _blank
- greeting:
    text_size: xl
    text: Lyoko
- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
      hour12: false
- resources:
    label: Lyoko
    cpu: true
    memory: true
    uptime: true
    refresh: 60000
# Adjust the coordinates and label to your city
- openmeteo:
    label: Paris
    latitude: 48.8566
    longitude: 2.3522
    timezone: Europe/Paris
    units: metric
