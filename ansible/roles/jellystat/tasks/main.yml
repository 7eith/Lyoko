---
- name: Start Jellystat
  when: jellystat_enabled is true
  block:
    - name: Check Jellystat secrets
      ansible.builtin.assert:
        that:
          - jellystat_db_password | length > 0
          - jellystat_jwt_secret | length > 0
        fail_msg: >-
          jellystat_db_password and jellystat_jwt_secret must be set in
          group_vars/all.yml (generate each with: openssl rand -hex 32).

    - name: Create Jellystat Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      with_items:
        - "{{ jellystat_config_directory }}"
        - "{{ jellystat_db_directory }}"

    - name: Create Jellystat Database Docker Container
      community.docker.docker_container:
        name: "{{ jellystat_db_container_name }}"
        image: "{{ jellystat_db_image_name }}:{{ jellystat_db_image_version }}"
        shm_size: "1g"
        volumes:
          - "{{ jellystat_db_directory }}:/var/lib/postgresql"
        env:
          TZ: "{{ core_timezone }}"
          POSTGRES_USER: "{{ jellystat_db_user }}"
          POSTGRES_PASSWORD: "{{ jellystat_db_password }}"
          POSTGRES_DB: "{{ jellystat_db_name }}"
        healthcheck:
          test: ["CMD-SHELL", "pg_isready --dbname=postgres --username={{ jellystat_db_user }}"]
          interval: "10s"
          timeout: "5s"
          retries: 5
        networks:
          - name: "proxy"
        pull: true
        restart_policy: unless-stopped

    - name: Wait for Jellystat Database to be healthy
      community.docker.docker_container_info:
        name: "{{ jellystat_db_container_name }}"
      register: jellystat_db_info
      until: jellystat_db_info.container.State.Health.Status | default('') == 'healthy'
      retries: 30
      delay: 5

    - name: Create Jellystat Docker Container
      community.docker.docker_container:
        name: "{{ jellystat_container_name }}"
        image: "{{ jellystat_image_name }}:{{ jellystat_image_version }}"
        volumes:
          - "{{ jellystat_config_directory }}:/app/backend/backup-data"
        env:
          TZ: "{{ core_timezone }}"
          POSTGRES_IP: "{{ jellystat_db_container_name }}"
          POSTGRES_PORT: "5432"
          POSTGRES_USER: "{{ jellystat_db_user }}"
          POSTGRES_PASSWORD: "{{ jellystat_db_password }}"
          POSTGRES_DB: "{{ jellystat_db_name }}"
          JWT_SECRET: "{{ jellystat_jwt_secret }}"
        networks:
          - name: "proxy"
        pull: true
        restart_policy: unless-stopped
        labels:
          traefik.enable: "true"
          traefik.http.routers.jellystat.rule: "Host(`{{ jellystat_domain }}.{{ lyoko_domain }}`)"
          traefik.http.routers.jellystat.entrypoints: "websecure"
          traefik.http.routers.jellystat.tls.certresolver: "cloudflare"
          traefik.http.services.jellystat.loadbalancer.server.port: "3000"
          traefik.docker.network: "proxy"
