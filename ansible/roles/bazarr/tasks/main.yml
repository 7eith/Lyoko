---
- name: Start Bazarr
  when: bazarr_enabled is true
  block:
    - name: Create Bazarr Directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      with_items:
        - "{{ bazarr_config_directory }}"

    - name: Create Bazarr Docker Container
      community.docker.docker_container:
        name: "{{ bazarr_container_name }}"
        image: "{{ bazarr_image_name }}:{{ bazarr_image_version }}"
        volumes:
          - "{{ bazarr_config_directory }}:/config"
          - "{{ alexandria_directory }}:/data"
        env:
          TZ: "{{ core_timezone }}"
          PUID: "{{ bazarr_puid }}"
          PGID: "{{ bazarr_pgid }}"
        networks:
          - name: "proxy"
        pull: true
        restart_policy: unless-stopped
        labels:
          traefik.enable: "true"
          traefik.http.routers.bazarr.rule: "Host(`{{ bazarr_domain }}.{{ lyoko_domain }}`)"
          traefik.http.routers.bazarr.entrypoints: "websecure"
          traefik.http.routers.bazarr.tls.certresolver: "cloudflare"
          traefik.http.services.bazarr.loadbalancer.server.port: "6767"
          traefik.docker.network: "proxy"
