---
- name: Lyoko
  hosts: all

  roles:

    ###
    ### Core
    ###

    - role: core
      become: true
      become_method: sudo

    ###
    ### Docker
    ###

    - role: geerlingguy.docker
      become: true
      become_method: sudo
      tags:
        - docker
        - skip_ansible_lint

    - role: lyoko-docker
      become: true
      become_method: sudo
      tags:
        - docker

    ###
    ### Apps
    ###

    - role: traefik
      tags:
        - traefik

    - role: homepage
      tags:
        - homepage

    - role: vaultwarden
      tags:
        - vaultwarden

    ###
    ### Monitoring
    ###

    - role: diun
      tags:
        - diun

    ###
    ### Media Server
    ###

    - role: jellyfin
      tags:
        - jellyfin
        - media

    - role: sonarr
      tags:
        - sonarr
        - media

    - role: radarr
      tags:
        - radarr
        - media

    - role: prowlarr
      tags:
        - prowlarr
        - media

    - role: gluetun
      tags:
        - gluetun
        - media

    - role: qbittorrent
      tags:
        - qbittorrent
        - media

    - role: qui
      tags:
        - qui
        - media

    - role: profilarr
      tags:
        - profilarr
        - media

    # Ygg indexer
    - role: ygege
      tags:
        - ygege
        - media
