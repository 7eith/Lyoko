# Will have docker access
lyoko_user: "seith"

# Email needed for Let's Encrypt SSL Certs
lyoko_user_email: "seith@gmail.com"

# Domain used by Lyoko
lyoko_domain: "seith.cloud"

# Lyoko directory and derived paths
lyoko_directory: "/lyoko"
apps_directory: "{{ lyoko_directory }}/apps"
alexandria_directory: "{{ lyoko_directory }}/alexandria"
media_directory: "{{ alexandria_directory }}/media"

# traefik api key from cloudflare (need Edit Zone + View Zone perms)
traefik_cf_dns_api_token: ""
# generate with: htpasswd -nb admin your_password
# do NOT escape the $ characters: these values are NOT processed by docker compose
traefik_dashboard_auth: ""

# Vaultwarden
# set to false once your account is created
vaultwarden_allow_signups: true
# generate with: openssl rand -base64 48
vaultwarden_admin_token: ""

# Diun (Docker image update notifications)
# Discord webhook: Channel Settings -> Integrations -> Webhooks -> New Webhook
diun_discord_webhook_url: ""

# Beszel (server & container monitoring)
# Hub first-run credentials (auto-created, also used by the Homepage widget)
beszel_username: ""
beszel_password: ""
# Hub -> Add System -> public key: paste it here, then re-run the beszel role
beszel_key: ""

# Homepage widgets (optional - leave empty to hide the widget)
# API keys: Sonarr/Radarr/Prowlarr -> Settings -> General -> Security -> API Key
#           Bazarr -> Settings -> General -> API Key (generated on first run)
#           Jellyfin -> Dashboard -> API Keys -> +
sonarr_api_key: ""
radarr_api_key: ""
prowlarr_api_key: ""
bazarr_api_key: ""
jellyfin_api_key: ""
# qBittorrent WebUI credentials
qbittorrent_username: ""
qbittorrent_password: ""

# AirVPN WireGuard (https://airvpn.org/enter/ -> Config Generator -> WireGuard)
# use the exact values from the generated config
wireguard_private_key: ""
wireguard_preshared_key: ""
wireguard_addresses: "" # e.g. "10.178.141.92/32"
wireguard_forwarded_port: ""
wireguard_countries: "" # e.g. "Switzerland,Netherlands"
